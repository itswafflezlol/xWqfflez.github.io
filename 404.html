<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | waffles development.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/06yp5nWP/uotgu.jpg">
<link rel="apple-touch-icon" href="https://i.postimg.cc/06yp5nWP/uotgu.jpg">

<meta property="og:title" content="404 - Page Not Found | waffles development.">
<meta property="og:description" content="The page you're looking for doesn't exist or has been moved.">
<meta property="og:image" content="https://i.postimg.cc/06yp5nWP/uotgu.jpg">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0e;
  --bg1:#12121a;
  --bg2:#1a1a24;
  --border:rgba(255,255,255,0.07);
  --border-h:rgba(255,255,255,0.14);
  --text:#f6f7ff;
  --muted:#8b8f9f;
  --dim:#5c5f6d;
  --gold:#FFD873;
  --gold-l:#FFE39F;
  --green:#22c55e;
  --nh:56px;
}
html,body{min-height:100vh;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nh);background:rgba(10,10,14,0.95);backdrop-filter:blur(16px);display:flex;align-items:center;border-bottom:1px solid var(--border);}
.ni{max-width:1080px;margin:0 auto;padding:0 28px;width:100%;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;}
.bmark{width:26px;height:26px;background:var(--gold);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;font-family:'Poppins',sans-serif;}
.bname{font-size:0.93rem;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
.nlinks{display:flex;align-items:center;gap:1px;}
.nl{background:none;border:none;padding:6px 12px;border-radius:6px;font-size:0.82rem;font-weight:500;color:var(--muted);cursor:pointer;font-family:'Poppins',sans-serif;transition:color 0.15s;}
.nl:hover{color:var(--text);}
.ncta{padding:6px 16px;background:var(--gold);border-radius:6px;color:#000;font-weight:600;font-size:0.82rem;border:none;cursor:pointer;font-family:'Poppins',sans-serif;transition:background-color 0.2s ease,color 0.2s ease,border-color 0.2s ease,opacity 0.2s ease;}
.ncta:hover{opacity:0.85;}
.btn-p{padding:9px 22px;background:var(--gold);border-radius:7px;color:#000;font-weight:600;font-size:0.84rem;border:none;cursor:pointer;font-family:'Poppins',sans-serif;transition:background-color 0.2s ease,color 0.2s ease,border-color 0.2s ease,opacity 0.2s ease;}
.btn-p:hover{opacity:0.85;}
.btn-s{padding:9px 22px;background:transparent;border:1px solid var(--border-h);border-radius:7px;color:var(--text);font-weight:500;font-size:0.84rem;cursor:pointer;font-family:'Poppins',sans-serif;transition:background-color 0.2s ease,color 0.2s ease,border-color 0.2s ease,opacity 0.2s ease;}
.btn-s:hover{border-color:rgba(255,255,255,0.25);}
.error-container{flex:1;display:flex;align-items:center;justify-content:center;padding:calc(var(--nh) + 72px) 28px 72px;}
.error-content{text-align:center;max-width:500px;}
.error-code{font-size:8rem;font-weight:800;color:var(--gold);letter-spacing:-0.05em;line-height:1;margin-bottom:20px;}
.error-title{font-size:2rem;font-weight:700;color:var(--text);letter-spacing:-0.03em;margin-bottom:12px;}
.error-desc{font-size:1rem;color:var(--muted);line-height:1.7;margin-bottom:32px;}
.error-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
footer{border-top:1px solid var(--border);padding:28px 0;position:relative;z-index:1;}
.footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.footer-links{display:flex;gap:2px;}
.footer-links a,.footer-links button{background:none;border:none;color:var(--dim);font-size:0.8rem;font-family:'Poppins',sans-serif;cursor:pointer;padding:4px 9px;border-radius:5px;transition:color 0.15s;text-decoration:none;}
.footer-links a:hover,.footer-links button:hover{color:var(--muted);}
.footer-copy{font-size:0.78rem;color:var(--dim);}
@media(max-width:560px){
.wrap{padding:0 18px;}
.ni{padding:0 18px;}
.error-code{font-size:6rem;}
.error-title{font-size:1.6rem;}
.nlinks{display:none;}
}
</style>
<script>
(function(){
  var routes=['home','about','work','plugins','credits'];
  var m=location.pathname.match(/^(.*\/)([^\/]+?)(?:\.html)?\/?$/);
  if(m && routes.indexOf(m[2])!==-1){
    location.replace(m[1]+'?p='+m[2]+location.hash);
  }
})();
</script>
</head>
<body>

<nav>
  <div class="ni">
    <a class="brand" href="/">
      <div class="bmark" style="overflow:hidden;"><img src="https://i.postimg.cc/06yp5nWP/uotgu.jpg" alt="waffles development logo" style="width:100%;height:100%;object-fit:cover;"></div>
      <span class="bname">waffles development.</span>
    </a>
    <div class="nlinks">
      <a class="nl" href="/">Home</a>
      <a class="nl" href="/about">About</a>
      <a class="nl" href="/work">Work</a>
      <a class="nl" href="/plugins">Plugins</a>
      <a class="nl" href="/faq">FAQ</a>
    </div>
    <a class="ncta" href="https://discord.gg/A7NNfAN6c4" target="_blank">Hire Me</a>
  </div>
</nav>

<div class="error-container">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="error-btns">
      <button class="btn-p" onclick="window.location.href='/'">Go Home</button>
      <button class="btn-s" onclick="window.history.back()">Go Back</button>
    </div>
  </div>
</div>

<footer>
  <div class="ni">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/work">Work</a>
        <a href="/plugins">Plugins</a>
        <a href="/credits">Credits</a>
        <a href="/faq">FAQ</a>
        <a href="/privacy">Privacy</a>
      </div>
      <span class="footer-copy">&copy; 2026 waffles development.</span>
    </div>
  </div>
</footer>

</body>
</html>
